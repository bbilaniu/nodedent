name: CI

on:
  pull_request:
  push:
    branches: [main, beta]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODEDENT_DEPLOYMENT_MODE: ${{ github.event_name == 'push' && github.ref_name == 'main' && 'current' || github.event_name == 'push' && github.ref_name == 'beta' && 'beta' || 'sandbox' }}
      NODEDENT_DEPLOYMENT_BRANCH: ${{ github.head_ref || github.ref_name }}
      NODEDENT_DEPLOYMENT_COMMIT: ${{ github.sha }}
      NODEDENT_DEPLOYMENT_ORIGIN: ${{ github.event_name == 'push' && github.ref_name == 'main' && vars.NODEDENT_CURRENT_ORIGIN || github.event_name == 'push' && github.ref_name == 'beta' && vars.NODEDENT_BETA_ORIGIN || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate workflow syntax
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check versioning
        run: npm run versioning:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run domain tests
        run: npm test

      - name: Check documentation lifecycle
        run: npm run docs:check

      - name: Build
        run: npm run build

      - name: Check deployment identity
        run: npm run deployment:check

      - name: Check clinical security boundary
        run: npm run security:check

      - name: Check deployment build matrix
        run: npm run deployment:matrix

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Test production Sandbox in Chromium
        run: npm run test:e2e

      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-failures-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload deployment evidence
        uses: actions/upload-artifact@v7
        with:
          name: deployment-evidence-${{ github.sha }}
          path: |
            dist/deployment.json
            dist/index.html
            dist/_headers
          if-no-files-found: error
