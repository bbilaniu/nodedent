name: Version

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: version
  cancel-in-progress: false

jobs:
  changesets:
    permissions:
      contents: write
      pull-requests: write
    name: Create version pull request
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create or update version pull request
        uses: changesets/action@v1
        with:
          version: npm run version
          title: Version Packages
          commit: Version Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  detect_release:
    name: Detect versioned release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version_changed: ${{ steps.compare_versions.outputs.version_changed }}
    steps:
      - name: Checkout released commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Compare application versions
        id: compare_versions
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [[ -z "${BEFORE_SHA}" || "${BEFORE_SHA}" =~ ^0+$ ]]; then
            echo "No previous main commit is available; this is not a versioned release transition."
            echo "version_changed=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          previous_version="$(
            git show "${BEFORE_SHA}:package.json" |
              node -e 'let value = ""; process.stdin.setEncoding("utf8"); process.stdin.on("data", (chunk) => { value += chunk; }); process.stdin.on("end", () => { process.stdout.write(JSON.parse(value).version); });'
          )"
          current_version="$(node -p "require('./package.json').version")"

          echo "Application version transition: ${previous_version} -> ${current_version}"
          if [[ "${previous_version}" != "${current_version}" ]]; then
            echo "version_changed=true" >> "${GITHUB_OUTPUT}"
          else
            echo "version_changed=false" >> "${GITHUB_OUTPUT}"
          fi

  release-tag:
    permissions:
      contents: write
    name: Tag versioned release
    needs: [changesets, detect_release]
    if: needs.detect_release.outputs.version_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout released commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure Git bot identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate released version
        run: npm run versioning:check

      - name: Create and push release tag
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"
          head_commit="$(git rev-parse HEAD)"

          git fetch --tags origin

          if git show-ref --verify --quiet "refs/tags/${tag}"; then
            tag_commit="$(git rev-list -n 1 "${tag}")"
            if [[ "${tag_commit}" != "${head_commit}" ]]; then
              echo "Release tag ${tag} already points to ${tag_commit}, not ${head_commit}." >&2
              exit 1
            fi
          else
            npm run release
          fi

          tag_commit="$(git rev-list -n 1 "${tag}")"
          if [[ "${tag_commit}" != "${head_commit}" ]]; then
            echo "Release tag ${tag} was not created for ${head_commit}." >&2
            exit 1
          fi

          git push origin "refs/tags/${tag}"

  sync-beta:
    permissions:
      contents: write
    name: Fast-forward beta after versioning
    needs: release-tag
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODEDENT_DEPLOYMENT_MODE: beta
      NODEDENT_DEPLOYMENT_BRANCH: beta
      NODEDENT_DEPLOYMENT_COMMIT: ${{ github.sha }}
      NODEDENT_DEPLOYMENT_ORIGIN: ${{ vars.NODEDENT_BETA_ORIGIN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run exact-commit Beta quality gate
        run: npm run ci:local:full

      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: beta-browser-failures-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload Beta deployment evidence
        uses: actions/upload-artifact@v7
        with:
          name: beta-deployment-evidence-${{ github.sha }}
          path: |
            dist/deployment.json
            dist/index.html
            dist/_headers
          if-no-files-found: error

      - name: Fast-forward beta to main
        shell: bash
        run: |
          git fetch origin beta
          if ! git merge-base --is-ancestor origin/beta HEAD; then
            echo "::error::beta advanced independently and cannot be fast-forwarded to main. Merge main back into beta; never force-push the branch."
            exit 1
          fi
          git push origin HEAD:beta

  sync-beta-without-release:
    permissions:
      contents: write
    name: Fast-forward beta after non-release main update
    needs: [changesets, detect_release]
    if: needs.detect_release.outputs.version_changed == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODEDENT_DEPLOYMENT_MODE: beta
      NODEDENT_DEPLOYMENT_BRANCH: beta
      NODEDENT_DEPLOYMENT_COMMIT: ${{ github.sha }}
      NODEDENT_DEPLOYMENT_ORIGIN: ${{ vars.NODEDENT_BETA_ORIGIN }}
    steps:
      - name: Checkout main update
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify the current release baseline
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"

          git fetch --tags origin
          if ! git show-ref --verify --quiet "refs/tags/${tag}"; then
            echo "::error::Release tag ${tag} is missing. Recover the exact version-changing commit manually; refusing to tag or synchronize from the current commit."
            exit 1
          fi

          tag_commit="$(git rev-list -n 1 "${tag}")"
          if ! git merge-base --is-ancestor "${tag_commit}" HEAD; then
            echo "::error::Release tag ${tag} points to ${tag_commit}, which is not an ancestor of main."
            exit 1
          fi

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run exact-commit Beta quality gate
        run: npm run ci:local:full

      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: beta-browser-failures-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload Beta deployment evidence
        uses: actions/upload-artifact@v7
        with:
          name: beta-deployment-evidence-${{ github.sha }}
          path: |
            dist/deployment.json
            dist/index.html
            dist/_headers
          if-no-files-found: error

      - name: Fast-forward beta to main
        shell: bash
        run: |
          git fetch origin beta
          if ! git merge-base --is-ancestor origin/beta HEAD; then
            echo "::error::beta advanced independently and cannot be fast-forwarded to main. Merge main back into beta; never force-push the branch."
            exit 1
          fi
          git push origin HEAD:beta

  archive-release:
    permissions:
      contents: write
    name: Create historical Sandbox branch
    needs: release-tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout released commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare historical Sandbox build identity
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"
          archive_branch="archive/${tag}"
          head_commit="$(git rev-parse HEAD)"

          git fetch --tags origin
          tag_commit="$(git rev-list -n 1 "${tag}")"

          if [[ "${tag_commit}" != "${head_commit}" ]]; then
            echo "Release tag ${tag} points to ${tag_commit}, not checked-out commit ${head_commit}." >&2
            exit 1
          fi

          {
            echo "NODEDENT_DEPLOYMENT_MODE=sandbox"
            echo "NODEDENT_DEPLOYMENT_BRANCH=${archive_branch}"
            echo "NODEDENT_DEPLOYMENT_COMMIT=${tag_commit}"
          } >> "${GITHUB_ENV}"

      - name: Build historical Sandbox artifact
        run: npm run build

      - name: Check historical Sandbox deployment identity
        run: npm run deployment:check

      - name: Check historical Sandbox security boundary
        run: npm run security:check

      - name: Create immutable archive branch from release tag
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"
          archive_branch="archive/${tag}"

          git fetch --tags origin
          tag_commit="$(git rev-list -n 1 "${tag}")"
          remote_commit="$(git ls-remote --heads origin "refs/heads/${archive_branch}" | cut -f1)"

          if [[ -n "${remote_commit}" && "${remote_commit}" != "${tag_commit}" ]]; then
            echo "Archive branch ${archive_branch} already points to ${remote_commit}, not ${tag_commit}." >&2
            exit 1
          fi

          if [[ -z "${remote_commit}" ]]; then
            git push origin "${tag_commit}:refs/heads/${archive_branch}"
          fi

          {
            echo "### Historical Sandbox source"
            echo "- Tag: \`${tag}\`"
            echo "- Commit: \`${tag_commit}\`"
            echo "- Branch: \`${archive_branch}\`"
            echo "- Artifact validation: Historical Sandbox checks passed"
            echo "- Cloudflare deployment: Pending external branch build"
          } >> "${GITHUB_STEP_SUMMARY}"
