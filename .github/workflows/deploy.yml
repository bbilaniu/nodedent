name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODEDENT_DEPLOYMENT_MODE: current
      NODEDENT_DEPLOYMENT_BRANCH: ${{ github.ref_name }}
      NODEDENT_DEPLOYMENT_COMMIT: ${{ github.sha }}
      NODEDENT_DEPLOYMENT_ORIGIN: ${{ vars.NODEDENT_CURRENT_ORIGIN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run exact-commit quality gate and build
        run: npm run ci:local:full

      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: deployment-browser-failures-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  smoke:
    name: Read-only deployed-site smoke
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      NODEDENT_SMOKE_URL: ${{ vars.NODEDENT_CURRENT_ORIGIN }}
      NODEDENT_SMOKE_MODE: current
      NODEDENT_SMOKE_BRANCH: main
      NODEDENT_SMOKE_COMMIT: ${{ github.sha }}
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Check deployed application without opening a vault
        shell: bash
        run: |
          NODEDENT_SMOKE_VERSION="$(node -p "require('./package.json').version")"
          export NODEDENT_SMOKE_VERSION
          npm run test:smoke
