name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NODEDENT_DEPLOYMENT_MODE: current
      NODEDENT_DEPLOYMENT_BRANCH: ${{ github.ref_name }}
      NODEDENT_DEPLOYMENT_COMMIT: ${{ github.sha }}
      NODEDENT_DEPLOYMENT_ORIGIN: ${{ vars.NODEDENT_CURRENT_ORIGIN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run exact-commit quality gate and build
        run: npm run ci:local

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
