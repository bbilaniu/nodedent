version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: beta
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      development-patch-minor:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # Keep the CLI compatible with the release action until a joint migration.
      - dependency-name: "@changesets/cli"
        update-types: [version-update:semver-major]
      # TypeScript 7.0 lacks the compiler API needed by ESLint; reassess with 7.1.
      - dependency-name: "typescript"
        versions: [">=7.0.0 <7.1.0"]
      # Review on 2026-10-28; this reminder does not automatically expire the rule.
      - dependency-name: "@types/node"
        versions: ["^25.0.0", "^26.0.0", "^27.0.0"]
  - package-ecosystem: github-actions
    directory: /
    target-branch: beta
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    ignore:
      # Action v2 requires Changesets CLI v3; migrate them together separately.
      - dependency-name: changesets/action
        update-types: [version-update:semver-major]
